services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-18080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-php_login}
      DB_USER: ${DB_USER:-user_php_login}
      DB_PASS: ${DB_PASS:-senha_local}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-php_login}
      MYSQL_USER: ${DB_USER:-user_php_login}
      MYSQL_PASSWORD: ${DB_PASS:-senha_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_local}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
